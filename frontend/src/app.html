<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="icon" href="data:," />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
    rel="stylesheet"
  />
  %sveltekit.head%
  <style>
    #splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.9rem;
      background: #faf7f0;
      font-family: 'Inter', sans-serif;
      transition: opacity 0.25s ease;
    }
    #splash.hidden {
      opacity: 0;
      pointer-events: none;
    }
    #splash h1 {
      font-family: 'Source Serif 4', serif;
      font-size: 1.6rem;
      color: #7a5c2e;
      margin: 0;
      letter-spacing: 0.02em;
    }
    #splash .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid #e4dcc8;
      border-top-color: #b1893f;
      border-radius: 50%;
      animation: splash-spin 0.8s linear infinite;
    }
    @keyframes splash-spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body data-sveltekit-preload-data="hover">
  <div id="splash">
    <h1>Better Brighter Multi-Ledger</h1>
    <div class="spinner"></div>
  </div>
  <div style="display: contents">%sveltekit.body%</div>
</body>
</html>
